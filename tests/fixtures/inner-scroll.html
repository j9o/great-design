<!doctype html><html><head><meta charset="utf-8"><title>Inner scroll probe</title>
<style>html,body{height:100%;margin:0;overflow:hidden}main{height:100%;overflow:auto}section{height:900px;background:#ff0000}main.scrolled section{background:#00ff00}</style>
</head><body><main><section></section><section></section><section></section></main>
<script>document.querySelector('main').addEventListener('scroll',e=>e.target.classList.add('scrolled'),{once:true});</script>
</body></html>
