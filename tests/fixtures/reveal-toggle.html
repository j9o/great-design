<!doctype html><html><head><meta charset="utf-8"><title>Two-way reveal probe</title>
<style>body{margin:0}section{height:900px;background:#00ff00;opacity:0;transition:opacity 10s}section.in{opacity:1}</style>
</head><body><section></section><section></section><section></section><section></section>
<script>const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in',e.isIntersecting)));document.querySelectorAll('section').forEach(s=>io.observe(s));</script>
</body></html>
